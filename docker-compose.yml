services:
  ktb-portainer:
    build: ./ktb-portainer
    container_name: ktb-portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  ktb-nginx:
    build: ./ktb-nginx
    container_name: ktb-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ktb-nginx/conf.d:/etc/nginx/conf.d
      - ./ktb-nginx/certs:/etc/nginx/certs

  ktb-certbot:
    container_name: ktb-certbot
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - /etc/letsencrypt/certbot/conf:/etc/letsencrypt
      - /etc/letsencrypt/certbot/www:/var/www/certbot
    depends_on:
      - ktb-nginx
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  portainer_data: