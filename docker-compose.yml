version: '3.8'

services:
  ktb-certbot:
    image: certbot/certbot
    container_name: ktb-certbot
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
  
  ktb-nginx:
    build: ./ktb-nginx
    container_name: ktb-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ktb-nginx/conf.d:/etc/nginx/conf.d
      - ./ktb-nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/nginx/html:/usr/share/nginx/html
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
  
  ktb-portainer:
    build: ./ktb-portainer
    container_name: ktb-portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  portainer_data:

