upstream portainer_upstream {
    server ktb-portainer:9000;
}

server {
    listen 80;
    server_name wepick.cloud portainer.wepick.cloud;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name wepick.cloud;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/wepick.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wepick.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
    }
}

server {
    listen 443;
    server_name portainer.wepick.cloud;

    ssl_certificate /etc/letsencrypt/live/portainer.wepick.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portainer.wepick.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /portainer {
        return 301 /portainer/;
    }

    location /portainer/ {
        set $upstream_endpoint http://portainer_upstream;
        rewrite ^/portainer/(.*) /$1 break;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass $upstream_endpoint;
    }

    location /portainer/api/websocket/ {
        set $upstream_endpoint http://portainer_upstream/api/websocket;
        rewrite ^/portainer/api/websocket/(.*) /$1 break;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_pass $upstream_endpoint;
    }
}
