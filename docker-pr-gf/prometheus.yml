global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "nginx-node"
    static_configs:
      - targets: ["<NGINX_PRIVATE_IP>:9100"]

  - job_name: "be-node"
    static_configs:
      - targets: ["<BE_PRIVATE_IP>:9100"]

  - job_name: "spring-actuator"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["<BE_PRIVATE_IP>:8080"]
