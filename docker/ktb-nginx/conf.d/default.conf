upstream portainer_upstream {
    server ktb-portainer:9000;
}

server {
    listen 80;
    server_name wepick.cloud portainer.wepick.cloud;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name wepick.cloud;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/wepick.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wepick.cloud/privkey.pem;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}

server {
    listen 443 ssl;
    server_name portainer.wepick.cloud;

    ssl_certificate /etc/letsencrypt/live/wepick.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wepick.cloud/privkey.pem;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://portainer_upstream;
    }
}
