server {
    listen 443 ssl;
    server_name registry.wepick.cloud;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/wepick.cloud-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wepick.cloud-0001/privkey.pem;

    # image push 시 큰 용량의 파일 업로드를 위해 최대 허용 크기 증가
    client_max_body_size 1g;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://registry_upstream;
    }
}

server {
    listen 443 ssl;
    server_name monitoring.wepick.cloud;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/wepick.cloud-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wepick.cloud-0001/privkey.pem;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://monitoring_upstream;
    }

    location /api/live/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        proxy_pass http://monitoring_upstream;
    }
}
