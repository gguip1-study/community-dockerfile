upstream registry_upstream {
    server ktb-private-registry:5000;
}

# upstream frontend_upstream {
#     server 10.0.1.223:3000;
# }

upstream backend_upstream {
    server 10.0.1.206:8080;
}

upstream monitoring_upstream {
    server 10.0.1.105:3000;
}

server {
    listen 80;
    server_name wepick.cloud portainer.wepick.cloud registry.wepick.cloud api.wepick.cloud monitoring.wepick.cloud;
    server_tokens off;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

