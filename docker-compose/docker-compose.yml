# version: '3.8'

services:
  ktb-nginx:
    build: ./ktb-nginx
    container_name: ktb-nginx
    restart: unless-stopped
    networks:
      - ktb-network
    ports:
      - "80:80"
      - "443:443"
      # - "8080:8080"
    # depends_on:
      # - ktb-portainer
      # - ktb-private-registry
    volumes:
      - ./ktb-nginx/conf.d:/etc/nginx/conf.d
      - ./ktb-nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_html:/usr/share/nginx/html
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
      - /var/log/nginx:/var/log/nginx
    
