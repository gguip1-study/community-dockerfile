version: '3.8'

services:
  ktb-nginx:
    build: ./ktb-nginx
    container_name: ktb-nginx
    restart: unless-stopped
    networks:
      - ktb-network
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - ktb-portainer
      - ktb-private-registry
    volumes:
      - ./ktb-nginx/conf.d:/etc/nginx/conf.d
      - ./ktb-nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_html:/usr/share/nginx/html
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot

  ktb-portainer:
    build: ./ktb-portainer
    container_name: ktb-portainer
    restart: unless-stopped
    networks:
      - ktb-network
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  ktb-private-registry:
    build: ./ktb-private-registry
    container_name: ktb-private-registry
    restart: unless-stopped
    networks:
      - ktb-network
    ports:
      - "5000:5000"
    volumes:
      - /var/lib/registry:/var/lib/registry

volumes:
  portainer_data:
    driver: local
  nginx_html:
    driver: local

networks:
  ktb-network:
    driver: bridge